id: anothergreet
name: Another Greeting Subflow
version: '1.0'
specVersion: '0.8'
description: Subflow that waits for loud event before completing

functions:
  - name: greetSubflowFunction
    type: custom
    operation: sysout

events:
  - name: loudEvent
    source: ''
    type: loud

start: GreetPersonSubflow

states:
  - name: GreetPersonSubflow
    type: operation
    actions:
      - name: greetSubflowAction
        functionRef:
          refName: greetSubflowFunction
          arguments:
            message: "Subflow started"
    transition: waitForEventSubflow

  - name: waitForEventSubflow
    type: event
    onEvents:
      - eventRefs:
          - loudEvent
        actions:
          - name: printAfterLoudEvent
            functionRef:
              refName: greetSubflowFunction
              arguments:
                message: "Received loud event in subflow"
    transition: GreetPersonAfterWaitSubflow

  - name: GreetPersonAfterWaitSubflow
    type: operation
    actions:
      - name: greetAfterWaitAction
        functionRef:
          refName: greetSubflowFunction
          arguments:
            message: "Subflow completed after wait"
    end:
      terminate: true
